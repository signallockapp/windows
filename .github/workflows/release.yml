name: Release

# Builds the Windows installer (build.ps1 → dotnet publish → Inno Setup) and
# publishes the setup .exe as a GitHub Release asset. The binary is NEVER
# committed to git — this workflow is the single source of distributable
# Windows builds.
#
#   Cut a release:  bump <Version> in SignalLock.csproj, commit, then
#                   git tag v0.1.0 && git push origin v0.1.0
#                   (the tag must equal that version — the job checks and fails).
#   Dry run:        Actions tab → Release → "Run workflow" (uploads an artifact,
#                   does not create a Release; skips the version check).
#
# Each release carries the same installer twice: SignalLock-Setup-<version>-x64.exe
# (pinned URL the website links to) and SignalLock-Setup-x64.exe (floating
# /releases/latest/download/… URL).
#
# The installer ships UNSIGNED today: users pass the SmartScreen
# "More info → Run anyway" prompt (documented on the download landing page). To
# sign, add an Authenticode signing step (signtool) on the published exe before
# "Stage release assets", using a certificate stored in repo secrets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release and upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The tag is a label; <Version> in SignalLock.csproj is the real version
      # (build.ps1 reads it, and it ends up in the .exe and in Add/Remove
      # Programs). Fail fast rather than ship an installer whose internal
      # version contradicts its release tag.
      - name: Verify tag matches csproj version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $node = ([xml](Get-Content SignalLock.csproj)).SelectSingleNode("//Project/PropertyGroup/Version")
          if (-not $node) { throw "No <Version> in SignalLock.csproj" }
          $version = $node.InnerText.Trim()
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match <Version>$version</Version> in SignalLock.csproj. Bump the csproj, commit, delete the tag, then re-tag."
          }
          Write-Host "version $version matches tag $env:GITHUB_REF_NAME"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Configuration Release -Runtime win-x64

      # Two names, same bytes, same SHA-256:
      #   SignalLock-Setup-<version>-x64.exe → pinned URL the website links to
      #   SignalLock-Setup-x64.exe           → /releases/latest/download/… (stable)
      - name: Stage release assets
        id: asset
        shell: pwsh
        run: |
          $src = Get-ChildItem installer/output/SignalLock-Setup-*-x64.exe | Select-Object -First 1
          $stable = "installer/output/SignalLock-Setup-x64.exe"
          Copy-Item $src.FullName $stable -Force
          $sha = (Get-FileHash -Algorithm SHA256 $stable).Hash.ToLower()
          "versioned_path=installer/output/$($src.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "stable_path=$stable"                         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          @(
            "### SignalLock for Windows"
            ""
            "| File | SHA-256 |"
            "|---|---|"
            "| ``$($src.Name)`` | ``$sha`` |"
            "| ``SignalLock-Setup-x64.exe`` | ``$sha`` |"
            ""
            "Both files are the same installer; the version-less name keeps"
            "``/releases/latest/download/SignalLock-Setup-x64.exe`` pointing at the newest build."
            ""
            "Verify: ``Get-FileHash -Algorithm SHA256 .\Downloads\$($src.Name)``"
          ) | Out-File -FilePath "$env:RUNNER_TEMP/notes.md" -Encoding utf8

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "${{ steps.asset.outputs.versioned_path }}" `
            "${{ steps.asset.outputs.stable_path }}" `
            --title "SignalLock $env:GITHUB_REF_NAME (Windows)" `
            --notes-file "$env:RUNNER_TEMP/notes.md"

      - name: Upload artifact (dry runs only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: SignalLock-Setup
          path: ${{ steps.asset.outputs.versioned_path }}
